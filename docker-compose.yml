version: '3.8'
services:
  python-analytics:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    restart: always

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    restart: always

  redis:
    image: redis
    ports:
      - "6379:6379"
    restart: always
